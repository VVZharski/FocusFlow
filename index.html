    body {

<body class="font-sans antialiased min-h-screen text-gray-200 selection:bg-white selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // Available Notification Sound Presets (Web Audio API)
    const SOUND_PRESETS = [
      { id: 'chime', name: 'Двойной колокольчик' },
      { id: 'digital', name: 'Цифровой будильник' },
      { id: 'soft', name: 'Мягкий гонг' },
      { id: 'marimba', name: 'Маримба' }
    ];

    // Synthesized sound player with preset selection
    function playNotificationSoundPreset(presetId = 'chime') {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
        const now = ctx.currentTime;

        if (presetId === 'digital') {
          // Beep beep digital alarm pattern
          for (let i = 0; i < 3; i++) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(1046.5, now + i * 0.15); // C6
            gain.gain.setValueAtTime(0.15, now + i * 0.15);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.1);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.15);
            osc.stop(now + i * 0.15 + 0.1);
          }
        } else if (presetId === 'soft') {
          // Warm soothing gong sound
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(432, now); // A4
          osc.frequency.exponentialRampToValueAtTime(216, now + 0.8);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 1.2);
        } else if (presetId === 'marimba') {
          // Playful wooden marimba triad (C5 - E5 - G5)
          const notes = [523.25, 659.25, 783.99];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.12);
            gain.gain.setValueAtTime(0.3, now + idx * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.12);
            osc.stop(now + idx * 0.12 + 0.4);
          });
        } else {
          // Default Chime (E5 -> A5 -> E6)
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();

          osc1.type = 'sine';
          osc2.type = 'sine';

          osc1.frequency.setValueAtTime(659.25, now);
          osc1.frequency.exponentialRampToValueAtTime(880, now + 0.18);

          osc2.frequency.setValueAtTime(880, now + 0.18);
          osc2.frequency.exponentialRampToValueAtTime(1318.51, now + 0.35);

          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);

          osc1.start(now);
          osc1.stop(now + 0.35);
          osc2.start(now + 0.18);
          osc2.stop(now + 0.9);
        }
      } catch (e) {
        console.log("Audio chime playback notice:", e);
      }
    }

    // Repeating Alarm Chime (plays like an alarm clock until stopped)
    let alarmTimerId = null;
    function startAlarmSound(soundEnabled = true, presetId = 'chime') {
      stopAlarmSound();
      if (!soundEnabled) return;

      playNotificationSoundPreset(presetId);
      alarmTimerId = setInterval(() => {
        playNotificationSoundPreset(presetId);
      }, 1200);
    }

    function stopAlarmSound() {
      if (alarmTimerId) {
        clearInterval(alarmTimerId);
        alarmTimerId = null;
      }
    }

    // Curated High-Quality Ambient Streams
    const RADIO_STATIONS = [
      { id: 'lofi', name: 'Lofi Chill Beats', url: 'https://stream.zeno.fm/f3wvbbqmdg8uv', genre: 'Chill / Lofi' },
      { id: 'chillhop', name: 'Chillhop Radio', url: 'https://stream.zeno.fm/0r0xa792kwzuv', genre: 'Hip Hop Beats' },
      { id: 'ambient', name: 'Deep Space Ambient', url: 'https://stream.zeno.fm/fvr757v784zuv', genre: 'Atmospheric' },
      { id: 'jazz', name: 'Midnight Jazz Cafe', url: 'https://stream.zeno.fm/eb6spu2w62zuv', genre: 'Smooth Jazz' },
      { id: 'piano', name: 'Peaceful Piano Focus', url: 'https://stream.zeno.fm/65n3q60948zuv', genre: 'Acoustic / Calm' },
    ];

    // Helper to format total seconds to HH:MM:SS or MM:SS
    function formatTime(totalSeconds, alwaysHours = false) {
      const sec = Math.max(0, Math.floor(totalSeconds));
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      const pad = (n) => String(n).padStart(2, '0');

      if (h > 0 || alwaysHours) {
        return `${pad(h)}:${pad(m)}:${pad(s)}`;
      }
      return `${pad(m)}:${pad(s)}`;
    }

    // Helper to convert minutes to readable string
    function formatMinutesHuman(totalMinutes) {
      const h = Math.floor(totalMinutes / 60);
      const m = totalMinutes % 60;
      if (h > 0 && m > 0) return `${h} ч ${m} мин`;
      if (h > 0) return `${h} ч`;
      return `${m} мин`;
    }

    // Get today's Russian date string format (e.g., "14 августа 2026 г.")
    function getTodayFormattedDate() {
      const date = new Date();
      const options = { day: 'numeric', month: 'long', year: 'numeric' };
      return date.toLocaleDateString('ru-RU', options) + ' г.';
    }

    const INITIAL_TASKS = [
      {
        id: 't-today',
        title: getTodayFormattedDate(),
        plannedMinutes: 480,
        actualSeconds: 0,
        totalWithPausesSeconds: 0,
        startedAt: null,
        overtimeSeconds: 0,
        completed: false,
        expanded: false,
        pauseCount: 0,
        children: []
      },
      {
        id: 't-1',
        title: 'Работа над видео',
        plannedMinutes: 180,
        actualSeconds: 0,
        totalWithPausesSeconds: 0,
        startedAt: null,
        overtimeSeconds: 0,
        completed: false,
        expanded: false,
        pauseCount: 0,
        children: [
          {
            id: 't-1-1',
            title: 'Концепт',
            plannedMinutes: 60,
            actualSeconds: 0,
            totalWithPausesSeconds: 0,
            startedAt: null,
            overtimeSeconds: 0,
            completed: false,
            pauseCount: 0,
            children: []
          },
          {
            id: 't-1-2',
            title: 'Раскадровка',
            plannedMinutes: 60,
            actualSeconds: 0,
            totalWithPausesSeconds: 0,
            startedAt: null,
            overtimeSeconds: 0,
            completed: false,
            pauseCount: 0,
            children: []
          }
        ]
      }
    ];

    // ==========================================
    // LUXURY ANALOG CLOCK COMPONENT
    // ==========================================
    function AnalogTimerClock({ 
      clockSeconds, 
      displayDigitalSeconds, 
      totalPlannedSeconds, 
      overtimeSeconds, 
      isOvertime, 
      pomodoroEnabled, 
      pomodoroFocusTime, 
      timerRunning, 
      isPaused, 
      isOnBreak, 
      isMusicEnabled 
    }) {
      const center = 200;
      const clockRadius = 145;
      const strokeWidth = 10;
      const circum = 2 * Math.PI * (clockRadius - strokeWidth / 2);

      // Rotation angles in degrees (always strictly clockwise based on elapsed clockSeconds)
      const secondAngle = (clockSeconds % 60) * 6;
      const minuteAngle = ((clockSeconds / 60) % 60) * 6;
      const hourAngle = ((clockSeconds / 3600) % 12) * 30;

      // Arc Ratio Logic:
      let progressRatio = 0;
      if (isOnBreak && totalPlannedSeconds > 0) {
        progressRatio = Math.min(1, clockSeconds / totalPlannedSeconds);
      } else if (pomodoroEnabled) {
        const cycleSec = pomodoroFocusTime * 60;
        progressRatio = Math.min(1, (clockSeconds % cycleSec) / cycleSec);
      } else if (totalPlannedSeconds > 0) {
        progressRatio = Math.min(1, clockSeconds / totalPlannedSeconds);
      } else {
        progressRatio = (clockSeconds % 60) / 60;
      }
      const strokeDashoffset = circum - progressRatio * circum;

      // Target Marker Angle for Task Planned Minutes (if Pomodoro OFF)
      const plannedMinutes = Math.round(totalPlannedSeconds / 60);
      const targetMarkerAngle = (plannedMinutes % 60) * 6;

      // Ticks
      const ticks = useMemo(() => {
        const result = [];
        for (let i = 0; i < 60; i++) {
          const angle = (i * 6) * (Math.PI / 180);
          const isMajor = i % 5 === 0;
          const tickLength = isMajor ? 12 : 6;
          const rInner = clockRadius - 24;
          const rOuter = rInner + tickLength;

          const x1 = center + rInner * Math.sin(angle);
          const y1 = center - rInner * Math.cos(angle);
          const x2 = center + rOuter * Math.sin(angle);
          const y2 = center - rOuter * Math.cos(angle);

          result.push(
            <line
              key={i}
              x1={x1}
              y1={y1}
              x2={x2}
              y2={y2}
              stroke={isMajor ? (isPaused ? '#fca5a5' : isOvertime ? '#fef08a' : '#e5e5e5') : (isPaused ? '#7f1d1d' : '#444444')}
              strokeWidth={isMajor ? 2.5 : 1}
              strokeLinecap="round"
            />
          );
        }
        return result;
      }, [clockRadius, center, isPaused, isOvertime]);

      // Color strategy
      const glowStopColor1 = isPaused ? '#f43f5e' : isOnBreak ? '#3b82f6' : !isMusicEnabled ? '#ffffff' : isOvertime ? '#f59e0b' : '#10b981';
      const glowStopColor2 = isPaused ? '#9f1239' : isOnBreak ? '#1d4ed8' : !isMusicEnabled ? '#cccccc' : isOvertime ? '#d97706' : '#059669';

      const mainArcStroke = isPaused ? "url(#roseArc)" : isOnBreak ? "url(#blueArc)" : isOvertime ? "url(#amberArc)" : "url(#emeraldArc)";
      const handColor = isPaused ? "#f43f5e" : isOnBreak ? "#3b82f6" : isOvertime ? "#f59e0b" : "#10b981";

      return (
        <div className="relative flex items-center justify-center my-4">
          <svg width="410" height="410" viewBox="0 0 400 400" className="drop-shadow-2xl overflow-visible">
            <defs>
              <radialGradient id="clockFaceBg" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stopColor={isPaused ? '#250f14' : '#222222'} />
                <stop offset="70%" stopColor={isPaused ? '#180a0d' : '#161616'} />
                <stop offset="100%" stopColor={isPaused ? '#0f0507' : '#0d0d0d'} />
              </radialGradient>

              <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor={isPaused ? '#7f1d1d' : '#444444'} />
                <stop offset="50%" stopColor={isPaused ? '#4c0519' : '#262626'} />
                <stop offset="100%" stopColor={isPaused ? '#1f040a' : '#121212'} />
              </linearGradient>

              <linearGradient id="emeraldArc" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#34d399" />
                <stop offset="100%" stopColor="#059669" />
              </linearGradient>

              <linearGradient id="amberArc" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#fbbf24" />
                <stop offset="100%" stopColor="#d97706" />
              </linearGradient>

              <linearGradient id="blueArc" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#60a5fa" />
                <stop offset="100%" stopColor="#2563eb" />
              </linearGradient>

              <linearGradient id="roseArc" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#fb7185" />
                <stop offset="100%" stopColor="#e11d48" />
              </linearGradient>

              {/* Dynamic Ripple Glow */}
              <radialGradient id="musicRippleGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stopColor={glowStopColor1} stopOpacity={timerRunning || isPaused ? "0.65" : "0.3"} />
                <stop offset="70%" stopColor={glowStopColor2} stopOpacity={timerRunning || isPaused ? "0.3" : "0.1"} />
                <stop offset="100%" stopColor="transparent" stopOpacity="0" />
              </radialGradient>

              <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
            </defs>

            {/* RADIAL EXPANDING SOFT RIPPLE GLOW */}
            {(timerRunning || isPaused) && (
              <g className="ripple-waves">
                <circle
                  cx={center}
                  cy={center}
                  r="190"
                  fill="url(#musicRippleGlow)"
                  className="ripple-glow-1 text-center"
                />
                <circle
                  cx={center}
                  cy={center}
                  r="190"
                  fill="url(#musicRippleGlow)"
                  className="ripple-glow-2 text-center"
                />
              </g>
            )}

            {/* Outer Rim */}
            <circle cx={center} cy={center} r="154" fill="url(#metalRim)" stroke={isPaused ? '#881337' : '#333333'} strokeWidth="2" />
            <circle cx={center} cy={center} r="147" fill="url(#clockFaceBg)" stroke={isPaused ? '#4c0519' : '#262626'} strokeWidth="2" />

            {/* Track Circle */}
            <circle
              cx={center}
              cy={center}
              r={clockRadius - strokeWidth / 2}
              fill="none"
              stroke={isPaused ? '#3f121a' : '#262626'}
              strokeWidth={strokeWidth}
            />

            {/* Forward Progress Arc */}
            <circle
              cx={center}
              cy={center}
              r={clockRadius - strokeWidth / 2}
              fill="none"
              stroke={mainArcStroke}
              strokeWidth={strokeWidth}
              strokeDasharray={circum}
              strokeDashoffset={strokeDashoffset}
              strokeLinecap="round"
              transform={`rotate(-90 ${center} ${center})`}
              filter="url(#glow)"
              className="transition-all duration-500"
            />

            {/* TARGET TIME MARKER ON RIM */}
            {totalPlannedSeconds > 0 && !isOnBreak && !pomodoroEnabled && (
              <g transform={`rotate(${targetMarkerAngle} ${center} ${center})`}>
                <line
                  x1={center}
                  y1={center - clockRadius + 10}
                  x2={center}
                  y2={center - clockRadius - 6}
                  stroke={isOvertime ? "#f59e0b" : "#10b981"}
                  strokeWidth="3.5"
                  strokeLinecap="round"
                  filter="url(#glow)"
                />
                <circle
                  cx={center}
                  cy={center - clockRadius - 6}
                  r="3.5"
                  fill={isOvertime ? "#f59e0b" : "#10b981"}
                />
              </g>
            )}

            {/* Ticks */}
            {ticks}

            {/* Minute Hand */}
            <line
              x1={center}
              y1={center}
              x2={center}
              y2={center - (clockRadius - 38)}
              stroke={isPaused ? '#fecdd3' : '#e5e5e5'}
              strokeWidth="4.5"
              strokeLinecap="round"
              transform={`rotate(${minuteAngle} ${center} ${center})`}
            />

            {/* Hour Hand */}
            <line
              x1={center}
              y1={center}
              x2={center}
              y2={center - (clockRadius - 60)}
              stroke={isPaused ? '#9f1239' : '#888888'}
              strokeWidth="6"
              strokeLinecap="round"
              transform={`rotate(${hourAngle} ${center} ${center})`}
            />

            {/* SECOND ARROW HAND */}
            <g transform={`rotate(${secondAngle} ${center} ${center})`}>
              <line
                x1={center}
                y1={center + 15}
                x2={center}
                y2={center - (clockRadius - 15)}
                stroke={handColor}
                strokeWidth="2.5"
                strokeLinecap="round"
                filter="url(#glow)"
              />
              <polygon
                points={`${center - 4.5},${center - (clockRadius - 20)} ${center + 4.5},${center - (clockRadius - 20)} ${center},${center - (clockRadius - 8)}`}
                fill={handColor}
                filter="url(#glow)"
              />
            </g>

            {/* Center Cap Nut */}
            <circle cx={center} cy={center} r="7" fill={handColor} />
            <circle cx={center} cy={center} r="2.5" fill="#ffffff" />

            {/* Digital Readout in Center */}
            <foreignObject x={center - 95} y={center + 25} width="190" height="65">
              <div className="text-center">
                <div className={`text-2xl font-mono font-black tracking-tight ${isPaused ? 'text-accent-rose' : isOnBreak ? 'text-blue-400' : isOvertime ? 'text-accent-amber' : 'text-white'}`}>
                  {isOvertime ? `+${formatTime(overtimeSeconds)}` : formatTime(displayDigitalSeconds)}
                </div>
                <div className={`text-[10px] uppercase tracking-widest font-bold mt-0.5 ${isPaused ? 'text-accent-rose' : isOvertime ? 'text-accent-amber' : 'text-gray-400'}`}>
                  {isOnBreak ? '☕ ПЕРЕРЫВ (ОТДЫХ)' : isPaused ? '⏸ НА ПАУЗЕ' : isOvertime ? '⚠️ ДОП. ВРЕМЯ' : timerRunning ? '▶ В РАБОТЕ' : '⏹ ГОТОВ К СТАРТУ'}
                </div>
              </div>
            </foreignObject>
          </svg>
        </div>
      );
    }

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    function App() {
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem('focusflow_graphite_tasks_v5');
        return saved ? JSON.parse(saved) : INITIAL_TASKS;
      });

      const [isTaskListExpanded, setIsTaskListExpanded] = useState(true);
      const [isPomodoroPanelExpanded, setIsPomodoroPanelExpanded] = useState(false);
      const [activeTaskId, setActiveTaskId] = useState(null);
      const [timerRunning, setTimerRunning] = useState(false);
      const [isPausedManual, setIsPausedManual] = useState(false);
      const [isOvertime, setIsOvertime] = useState(false);

      // Work elapsed time (seconds from 0 onwards)
      const [elapsedWorkSeconds, setElapsedWorkSeconds] = useState(0);
      const [overtimeSeconds, setOvertimeSeconds] = useState(0);

      // Pomodoro Configurator State
      const [pomodoroEnabled, setPomodoroEnabled] = useState(false);
      const [pomodoroFocusTime, setPomodoroFocusTime] = useState(45);
      const [pomodoroBreakTime, setPomodoroBreakTime] = useState(10);
      const [focusIntervalSeconds, setFocusIntervalSeconds] = useState(0);

      // Pause Sound & Preset State
      const [isPauseSoundEnabled, setIsPauseSoundEnabled] = useState(true);
      const [selectedPauseSoundId, setSelectedPauseSoundId] = useState('chime');

      // Break State (Countdown timer + elapsed seconds for clockwise hands)
      const [isOnBreak, setIsOnBreak] = useState(false);
      const [breakRemainingSeconds, setBreakRemainingSeconds] = useState(0);
      const [breakElapsedSeconds, setBreakElapsedSeconds] = useState(0);
      const [pomodoroCount, setPomodoroCount] = useState(0);

      // Radio Selector & Volume State
      const [currentStationIndex, setCurrentStationIndex] = useState(1);
      const [isMusicEnabled, setIsMusicEnabled] = useState(false);
      const [volume, setVolume] = useState(0.7);
      const audioRef = useRef(null);

      // Navigation & Modal states
      const [activeTab, setActiveTab] = useState('planner');
      const [showBreakPromptModal, setShowBreakPromptModal] = useState(false);
      const [showBreakFinishedModal, setShowBreakFinishedModal] = useState(false);
      const [showTaskOvertimeModal, setShowTaskOvertimeModal] = useState(false);
      const [editingTask, setEditingTask] = useState(null);

      const activeStation = RADIO_STATIONS[currentStationIndex];

      useEffect(() => {
        localStorage.setItem('focusflow_graphite_tasks_v5', JSON.stringify(tasks));
      }, [tasks]);

      // Apply dynamic body background theme (Red on pause)
      useEffect(() => {
        if (isPausedManual) {
          document.body.classList.add('is-paused-theme');
        } else {
          document.body.classList.remove('is-paused-theme');
        }
      }, [isPausedManual]);

      // Audio playback & volume effect
      useEffect(() => {
        if (!audioRef.current) return;
        audioRef.current.volume = volume;
        if (isMusicEnabled && (timerRunning || isOnBreak)) {
          audioRef.current.play().catch(err => console.log("Audio play restriction:", err));
        } else {
          audioRef.current.pause();
        }
      }, [isMusicEnabled, timerRunning, isOnBreak, currentStationIndex, volume]);

      const handleToggleMusic = () => {
        const nextState = !isMusicEnabled;
        setIsMusicEnabled(nextState);
        if (nextState && audioRef.current) {
          audioRef.current.volume = volume;
          audioRef.current.play().catch(e => console.log("Gesture playback triggered"));
        } else if (audioRef.current) {
          audioRef.current.pause();
        }
      };

      // Toggling Pomodoro auto-expands settings when ON, collapses when OFF
      const handleTogglePomodoro = (enabled) => {
        setPomodoroEnabled(enabled);
        setIsPomodoroPanelExpanded(enabled);

        if (timerRunning) {
          setTimerRunning(false);
          setIsPausedManual(true);
          if (audioRef.current) audioRef.current.pause();
        }
        setFocusIntervalSeconds(0);
      };

      const handlePrevStation = () => {
        setCurrentStationIndex(prev => (prev === 0 ? RADIO_STATIONS.length - 1 : prev - 1));
        if (!isMusicEnabled) setIsMusicEnabled(true);
      };

      const handleNextStation = () => {
        setCurrentStationIndex(prev => (prev === RADIO_STATIONS.length - 1 ? 0 : prev + 1));
        if (!isMusicEnabled) setIsMusicEnabled(true);
      };

      const findTask = (taskList, id) => {
        for (const task of taskList) {
          if (task.id === id) return task;
          if (task.children && task.children.length > 0) {
            const found = findTask(task.children, id);
            if (found) return found;
          }
        }
        return null;
      };

      const updateTaskInTree = (taskList, id, updateFn) => {
        return taskList.map(task => {
          if (task.id === id) return updateFn(task);
          if (task.children && task.children.length > 0) {
            return {
              ...task,
              children: updateTaskInTree(task.children, id, updateFn)
            };
          }
          return task;
        });
      };

      const activeTask = useMemo(() => {
        return activeTaskId ? findTask(tasks, activeTaskId) : null;
      }, [tasks, activeTaskId]);

      // Handle Task Selection
      const handleSelectTask = (taskId) => {
        if (timerRunning) {
          if (!confirm('Работа идет. Переключить активную задачу? Накопленное время сохранится.')) {
            return;
          }
          setTimerRunning(false);
          setIsPausedManual(true);
        }

        const task = findTask(tasks, taskId);
        if (!task) return;

        setActiveTaskId(taskId);
        setIsOnBreak(false);
        setIsPausedManual(false);

        const actualSec = task.actualSeconds || 0;
        const targetPlannedSec = (task.plannedMinutes || 60) * 60;

        setElapsedWorkSeconds(actualSec);

        if (actualSec >= targetPlannedSec && targetPlannedSec > 0) {
          setIsOvertime(true);
          setOvertimeSeconds(task.overtimeSeconds || (actualSec - targetPlannedSec));
        } else {
          setIsOvertime(false);
          setOvertimeSeconds(0);
        }
        setFocusIntervalSeconds(0);
      };

      // TIMER TICK LOGIC (Master Clock 1 sec)
      useEffect(() => {
        let interval = setInterval(() => {
          // Increment totalWithPausesSeconds for active task whenever started (unless completed)
          if (activeTaskId) {
            const activeTaskObj = findTask(tasks, activeTaskId);
            if (activeTaskObj && activeTaskObj.startedAt && !activeTaskObj.completed) {
              setTasks(prevTasks => updateTaskInTree(prevTasks, activeTaskId, (t) => ({
                ...t,
                totalWithPausesSeconds: (t.totalWithPausesSeconds || t.actualSeconds || 0) + 1
              })));
            }
          }

          // If Break Modal or Overtime Modal is showing, actual work seconds CONTINUE to accumulate until break/pause is selected!
          if (showBreakPromptModal && activeTaskId && activeTask && !activeTask.completed) {
            setElapsedWorkSeconds(prev => prev + 1);
            setTasks(prevTasks => updateTaskInTree(prevTasks, activeTaskId, (t) => ({
              ...t,
              actualSeconds: (t.actualSeconds || 0) + 1
            })));
            return;
          }

          if (!timerRunning) return;

          // MODE A: BREAK TIMER (COUNTDOWN & ELAPSED)
          if (isOnBreak) {
            setBreakElapsedSeconds(prev => prev + 1);
            setBreakRemainingSeconds(prev => {
              if (prev <= 1) {
                setIsOnBreak(false);
                setTimerRunning(false);
                setFocusIntervalSeconds(0);
                startAlarmSound(isPauseSoundEnabled, selectedPauseSoundId);
                setShowBreakFinishedModal(true);
                return 0;
              }
              return prev - 1;
            });
            return;
          }

          // MODE B: WORK TIMER (COUNT-UP)
          const targetPlannedSec = activeTask ? (activeTask.plannedMinutes || 60) * 60 : 0;

          if (activeTask && activeTask.completed) {
            // Task is completed: Stop actual work time progression
            return;
          }

          setElapsedWorkSeconds(prevSec => {
            const nextSec = prevSec + 1;
            if (!pomodoroEnabled && targetPlannedSec > 0 && nextSec >= targetPlannedSec && !isOvertime) {
              setIsOvertime(true);
              startAlarmSound(isPauseSoundEnabled, selectedPauseSoundId);
              setShowTaskOvertimeModal(true);
            }
            return nextSec;
          });

          if (isOvertime && !pomodoroEnabled) {
            setOvertimeSeconds(prev => prev + 1);
          }

          if (activeTaskId) {
            setTasks(prevTasks => updateTaskInTree(prevTasks, activeTaskId, (t) => ({
              ...t,
              actualSeconds: (t.actualSeconds || 0) + 1,
              overtimeSeconds: isOvertime ? (t.overtimeSeconds || 0) + 1 : t.overtimeSeconds
            })));
          }

          // Pomodoro Interval Check
          if (pomodoroEnabled) {
            setFocusIntervalSeconds(prev => {
              const nextVal = prev + 1;
              if (nextVal >= pomodoroFocusTime * 60) {
                // Break modal pops up! Work time STILL ticks in background while user hesitates.
                startAlarmSound(isPauseSoundEnabled, selectedPauseSoundId);
                setShowBreakPromptModal(true);
                setPomodoroCount(c => c + 1);
                return 0;
              }
              return nextVal;
            });
          }

        }, 1000);

        return () => clearInterval(interval);
      }, [timerRunning, activeTaskId, pomodoroEnabled, pomodoroFocusTime, isOnBreak, isOvertime, activeTask, tasks, showBreakPromptModal, isPauseSoundEnabled, selectedPauseSoundId]);

      // Start Work Button
      const handleStartTimer = () => {
        let targetId = activeTaskId;

        if (!targetId) {
          const todayDateStr = getTodayFormattedDate();
          const existingTodayTask = tasks.find(t => t.title === todayDateStr);

          if (existingTodayTask) {
            targetId = existingTodayTask.id;
          } else {
            const newTodayTask = {
              id: 't-' + Date.now(),
              title: todayDateStr,
              plannedMinutes: 480,
              actualSeconds: 0,
              totalWithPausesSeconds: 0,
              startedAt: null,
              overtimeSeconds: 0,
              completed: false,
              expanded: false,
              pauseCount: 0,
              children: []
            };
            setTasks(prev => [newTodayTask, ...prev]);
            targetId = newTodayTask.id;
          }

          setActiveTaskId(targetId);
          const taskObj = findTask(tasks, targetId);
          setElapsedWorkSeconds(taskObj ? taskObj.actualSeconds : 0);
        }

        if (targetId) {
          const nowFormatted = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
          setTasks(prev => updateTaskInTree(prev, targetId, t => ({
            ...t,
            completed: false,
            startedAt: t.startedAt || nowFormatted,
            totalWithPausesSeconds: t.totalWithPausesSeconds || t.actualSeconds || 0
          })));
        }

        setIsOnBreak(false);
        setTimerRunning(true);
        setIsPausedManual(false);
        stopAlarmSound();
        if (isMusicEnabled && audioRef.current) {
          audioRef.current.play().catch(e => console.log(e));
        }
      };

      // Pause Work (Turns site RED)
      const handlePauseTimer = () => {
        setTimerRunning(false);
        setIsPausedManual(true);
        if (audioRef.current) audioRef.current.pause();

        if (activeTaskId) {
          setTasks(prev => updateTaskInTree(prev, activeTaskId, t => ({
            ...t,
            pauseCount: (t.pauseCount || 0) + 1
          })));
        }
      };

      // Skip Break & Resume Work immediately
      const handleSkipBreakAndResumeWork = () => {
        stopAlarmSound();
        setIsOnBreak(false);
        setBreakRemainingSeconds(0);
        setBreakElapsedSeconds(0);
        setFocusIntervalSeconds(0);
        handleStartTimer();
      };

      // Accept Break Start Prompt Modal -> NOW actual work time stops accumulating!
      const handleAcceptBreakPrompt = () => {
        stopAlarmSound();
        setShowBreakPromptModal(false);
        setIsOnBreak(true);
        setIsPausedManual(false);
        setBreakElapsedSeconds(0);
        setBreakRemainingSeconds(pomodoroBreakTime * 60);
        setTimerRunning(true);
      };

      // Reject/Skip Break Start Prompt Modal
      const handleSkipBreakPrompt = () => {
        stopAlarmSound();
        setShowBreakPromptModal(false);
        setIsOnBreak(false);
        setFocusIntervalSeconds(0);
        handleStartTimer();
      };

      // Accept Break Finished Prompt Modal (Start Work)
      const handleAcceptBreakFinished = () => {
        stopAlarmSound();
        setShowBreakFinishedModal(false);
        setIsOnBreak(false);
        setFocusIntervalSeconds(0);
        handleStartTimer();
      };

      // Close Break Finished Prompt Modal (Remain Paused)
      const handleDismissBreakFinished = () => {
        stopAlarmSound();
        setShowBreakFinishedModal(false);
        setIsOnBreak(false);
        setFocusIntervalSeconds(0);
        setIsPausedManual(true);
      };

      // Add a custom new task
      const handleAddTask = () => {
        const newTaskObj = {
          id: 't-' + Date.now(),
          title: 'Хорошенько поработать',
          plannedMinutes: 60,
          actualSeconds: 0,
          totalWithPausesSeconds: 0,
          startedAt: null,
          overtimeSeconds: 0,
          completed: false,
          expanded: false,
          pauseCount: 0,
          children: []
        };
        setTasks(prev => [...prev, newTaskObj]);
        setIsTaskListExpanded(true);
      };

      const handleAddSubtaskDirectly = (parentId) => {
        const newSubtask = {
          id: 't-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
          title: 'Хорошенько поработать',
          plannedMinutes: 60,
          actualSeconds: 0,
          totalWithPausesSeconds: 0,
          startedAt: null,
          overtimeSeconds: 0,
          completed: false,
          expanded: false,
          pauseCount: 0,
          children: []
        };
        setTasks(prev => updateTaskInTree(prev, parentId, p => ({
          ...p,
          expanded: true,
          children: [...(p.children || []), newSubtask]
        })));
        setIsTaskListExpanded(true);
      };

      const handleSaveEditedTask = (e) => {
        e.preventDefault();
        if (!editingTask || !editingTask.title.trim()) return;

        const totalMins = (parseInt(editingTask.hours, 10) || 0) * 60 + (parseInt(editingTask.mins, 10) || 0);
        if (totalMins <= 0) {
          alert('Время задачи должно быть больше 0 минут.');
          return;
        }

        setTasks(prev => updateTaskInTree(prev, editingTask.id, t => ({
          ...t,
          title: editingTask.title.trim(),
          plannedMinutes: totalMins
        })));

        if (activeTaskId === editingTask.id) {
          const actualSec = editingTask.actualSeconds || 0;
          const totalPlannedSec = totalMins * 60;
          if (actualSec < totalPlannedSec) {
            setIsOvertime(false);
          }
        }

        setEditingTask(null);
      };

      const handleDeleteTask = (taskId, e) => {
        if (e) e.stopPropagation();
        if (!confirm('Удалить эту задачу и все её подзадачи?')) return;

        const removeRecursive = (list) => {
          return list
            .filter(t => t.id !== taskId)
            .map(t => ({
              ...t,
              children: removeRecursive(t.children)
            }));
        };

        setTasks(prev => removeRecursive(prev));
        if (activeTaskId === taskId) {
          setActiveTaskId(null);
          setTimerRunning(false);
          setIsPausedManual(false);
        }
      };

      const handleToggleComplete = (taskId, e) => {
        if (e) e.stopPropagation();
        setTasks(prev => updateTaskInTree(prev, taskId, t => {
          const isNowCompleted = !t.completed;
          if (isNowCompleted && activeTaskId === taskId) {
            setTimerRunning(false);
          }
          return {
            ...t,
            completed: isNowCompleted
          };
        }));
      };

      const stats = useMemo(() => {
        let totalPlannedSec = 0;
        let totalActualSec = 0;
        let totalOvertimeSec = 0;
        let totalTasksCount = 0;
        let completedTasksCount = 0;
        let totalPauseCount = 0;
        const taskBreakdown = [];

        const traverse = (list) => {
          for (const item of list) {
            totalTasksCount++;
            if (item.completed) completedTasksCount++;
            totalPlannedSec += ((item.plannedMinutes || 60) * 60);
            totalActualSec += (item.actualSeconds || 0);
            totalOvertimeSec += (item.overtimeSeconds || 0);
            totalPauseCount += (item.pauseCount || 0);

            taskBreakdown.push({
              title: item.title,
              plannedSec: (item.plannedMinutes || 60) * 60,
              actualSec: item.actualSeconds || 0,
              overtimeSec: item.overtimeSeconds || 0,
              completed: item.completed,
              pauseCount: item.pauseCount || 0
            });

            if (item.children && item.children.length > 0) {
              traverse(item.children);
            }
          }
        };

        traverse(tasks);

        return {
          totalPlannedSec,
          totalActualSec,
          totalOvertimeSec,
          totalTasksCount,
          completedTasksCount,
          totalPauseCount,
          taskBreakdown,
          completionPercentage: totalTasksCount ? Math.round((completedTasksCount / totalTasksCount) * 100) : 0
        };
      }, [tasks]);

      const renderTaskNode = (task, level = 0) => {
        const isSelected = activeTaskId === task.id;
        const totalSubtaskMinutes = task.children.reduce((acc, c) => acc + (c.plannedMinutes || 60), 0);
        const displayPlannedMinutes = task.children.length > 0 
          ? Math.max(task.plannedMinutes || 60, totalSubtaskMinutes)
          : (task.plannedMinutes || 60);

        const progressPercent = Math.min(100, Math.round((task.actualSeconds / (displayPlannedMinutes * 60)) * 100)) || 0;
        const hasSubtasks = task.children && task.children.length > 0;
        const isTaskOvertime = task.actualSeconds > (displayPlannedMinutes * 60);

        return (
          <div key={task.id} className="mb-2.5">
            <div
              onClick={() => handleSelectTask(task.id)}
              className={`group flex items-center justify-between p-4 rounded-xl cursor-pointer transition-all ${
                task.completed
                  ? 'bg-[#292212] border-2 border-accent-gold shadow-lg hover:border-yellow-400'
                  : isSelected
                    ? isPausedManual 
                      ? 'bg-[#2a0e13] border-2 border-accent-rose shadow-lg'
                      : 'bg-[#182c23] border-2 border-accent-emerald shadow-lg'
                    : 'card-graphite hover:border-gray-600'
              }`}
              style={{ marginLeft: `${level * 22}px` }}
            >
              <div className="flex items-center space-x-3 flex-1 min-w-0">
                {hasSubtasks ? (
                  <button
                    title="Раскрыть подзадачи"
                    onClick={(e) => {
                      e.stopPropagation();
                      setTasks(prev => updateTaskInTree(prev, task.id, t => ({ ...t, expanded: !t.expanded })));
                    }}
                    className="p-1.5 rounded-lg text-gray-400 hover:text-white hover:bg-gray-700 transition-colors"
                  >
                    <svg className={`w-4 h-4 transition-transform duration-200 ${task.expanded ? 'rotate-90 text-white' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M9 5l7 7-7 7" />
                    </svg>
                  </button>
                ) : (
                  <div className="w-7" />
                )}

                {/* GOLD COMPLETION CHECKBOX & HIGHLIGHT */}
                <button
                  onClick={(e) => handleToggleComplete(task.id, e)}
                  className={`w-5 h-5 rounded flex items-center justify-center border transition-colors shrink-0 ${
                    task.completed
                      ? 'bg-accent-gold border-accent-gold text-black font-extrabold shadow-sm shadow-yellow-500/50'
                      : 'border-gray-600 hover:border-white'
                  }`}
                >
                  {task.completed && (
                    <svg className="w-3.5 h-3.5 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3.5} d="M5 13l4 4L19 7" />
                    </svg>
                  )}
                </button>

                <div className="flex-1 min-w-0">
                  <div className="flex items-center space-x-2">
                    <span className={`font-semibold truncate text-sm ${task.completed ? 'line-through text-amber-300 font-bold' : 'text-white'}`}>
                      {task.title}
                    </span>
                    {task.completed && (
                      <span className="px-2 py-0.5 text-[10px] font-extrabold bg-accent-gold/20 text-accent-gold border border-accent-gold/50 rounded shadow-sm">
                        ★ ВЫПОЛНЕНА
                      </span>
                    )}
                    {isSelected && !task.completed && (
                      <span className={`px-2 py-0.5 text-[10px] font-bold rounded border ${
                        isPausedManual 
                          ? 'bg-accent-rose/20 text-accent-rose border-accent-rose/40' 
                          : 'bg-accent-emerald/20 text-accent-emerald border-accent-emerald/40'
                      }`}>
                        АКТИВНА
                      </span>
                    )}
                    {task.pauseCount > 0 && (
                      <span className="px-1.5 py-0.5 text-[10px] font-bold bg-[#333333] text-slate-300 rounded border border-gray-700" title="Количество пауз">
                        ⏸ {task.pauseCount}
                      </span>
                    )}
                  </div>

                  {/* Progress Bar (Green = Planned, Amber = Overtime) */}
                  <div className="w-full bg-[#121212] rounded-full h-1.5 mt-2 overflow-hidden border border-[#262626]">
                    <div
                      className={`h-full transition-all duration-300 ${
                        task.completed 
                          ? 'bg-accent-gold' 
                          : isTaskOvertime 
                            ? 'bg-accent-amber' 
                            : 'bg-accent-emerald'
                      }`}
                      style={{ width: `${progressPercent}%` }}
                    />
                  </div>
                </div>
              </div>

              <div className="flex items-center space-x-3 ml-3 shrink-0">
                <div className="text-right">
                  <div className="text-xs font-mono font-bold text-gray-200">
                    <span className={isTaskOvertime ? 'text-accent-amber font-extrabold' : 'text-accent-emerald font-bold'}>
                      {formatTime(task.actualSeconds)}
                    </span>
                    <span className="text-gray-400"> / {formatMinutesHuman(displayPlannedMinutes)}</span>
                  </div>
                  {task.overtimeSeconds > 0 && (
                    <div className="text-[10px] text-accent-amber font-mono font-semibold">
                      +{formatTime(task.overtimeSeconds)} доп
                    </div>
                  )}
                </div>

                <div className="flex items-center space-x-1 opacity-80 group-hover:opacity-100">
                  <button
                    title="Редактировать время и название"
                    onClick={(e) => {
                      e.stopPropagation();
                      setEditingTask({
                        id: task.id,
                        title: task.title,
                        hours: Math.floor((task.plannedMinutes || 60) / 60),
                        mins: (task.plannedMinutes || 60) % 60,
                        actualSeconds: task.actualSeconds
                      });
                    }}
                    className="p-1.5 text-gray-400 hover:text-white rounded hover:bg-gray-700"
                  >
                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                    </svg>
                  </button>

                  <button
                    title="Добавить подзадачу"
                    onClick={(e) => {
                      e.stopPropagation();
                      handleAddSubtaskDirectly(task.id);
                    }}
                    className="p-1.5 text-gray-400 hover:text-accent-emerald rounded hover:bg-gray-700"
                  >
                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />
                    </svg>
                  </button>

                  <button
                    title="Удалить"
                    onClick={(e) => handleDeleteTask(task.id, e)}
                    className="p-1.5 text-gray-400 hover:text-rose-400 rounded hover:bg-gray-700"
                  >
                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                  </button>
                </div>
              </div>
            </div>

            {task.expanded && task.children && task.children.length > 0 && (
              <div className="mt-2 border-l-2 border-gray-700/80 ml-5 pl-2 transition-all">
                {task.children.map(child => renderTaskNode(child, level + 1))}
              </div>
            )}
          </div>
        );
      };

      const clockSeconds = isOnBreak
        ? breakElapsedSeconds
        : pomodoroEnabled
          ? focusIntervalSeconds
          : elapsedWorkSeconds;

      const displayDigitalSeconds = isOnBreak
        ? breakRemainingSeconds
        : pomodoroEnabled
          ? focusIntervalSeconds
          : elapsedWorkSeconds;

      const displayTotalTargetSeconds = isOnBreak 
        ? pomodoroBreakTime * 60 
        : pomodoroEnabled 
          ? pomodoroFocusTime * 60 
          : (activeTask ? (activeTask.plannedMinutes || 60) * 60 : 0);

      // Calculations for Header Task Metrics
      const taskStartTimeDisplay = activeTask && activeTask.startedAt ? activeTask.startedAt : '—';
      const taskTotalWithPausesSec = activeTask ? (activeTask.totalWithPausesSeconds || activeTask.actualSeconds || 0) : 0;
      const taskActualSec = activeTask ? (activeTask.actualSeconds || 0) : 0;
      const taskPauseDurationSec = Math.max(0, taskTotalWithPausesSec - taskActualSec);
      const taskPlannedMins = activeTask ? (activeTask.plannedMinutes || 60) : 480;
      const taskPauseCount = activeTask ? (activeTask.pauseCount || 0) : 0;

      return (
        <div className="min-h-screen flex flex-col transition-colors duration-700">

          <audio ref={audioRef} src={activeStation.url} preload="none" />

          {/* Header Bar */}
          <header className={`border-b sticky top-0 z-40 backdrop-blur-md transition-colors duration-500 ${
            isPausedManual ? 'border-red-950 bg-[#160609]/95' : 'border-gray-800 bg-[#141414]/95'
          }`}>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
              <div className="flex items-center space-x-3 shrink-0">
                <div className={`w-9 h-9 rounded-lg font-extrabold text-lg shadow flex items-center justify-center transition-colors ${
                  isPausedManual ? 'bg-accent-rose text-white' : 'bg-white text-black'
                }`}>
                  F
                </div>
                <div className="hidden sm:block">
                  <h1 className="text-lg font-bold text-white tracking-tight">FocusFlow</h1>

                                      const isSelected = selectedPauseSoundId === preset.id;
                                      return (
                                        <button
                                          key={preset.id}
                                          onClick={() => {
                                            setSelectedPauseSoundId(preset.id);
                                            playNotificationSoundPreset(preset.id);
                                          }}
                                          className={`py-1.5 px-2.5 rounded-lg text-xs font-medium border flex items-center justify-between transition ${
                                            isSelected 
                                              ? 'bg-accent-emerald/20 border-accent-emerald text-accent-emerald font-bold' 
                                              : 'bg-[#181818] border-gray-800 text-gray-400 hover:text-white'
                                          }`}
                                        >
                                          <span className="truncate">{preset.name}</span>
                                          <svg className="w-3 h-3 ml-1 shrink-0 fill-current opacity-80" viewBox="0 0 24 24">
                                            <path d="M8 5v14l11-7z" />
                                          </svg>
                                        </button>
                                      );
                                    })}
                                  </div>
                                </div>
                              )}
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                              <div className="bg-[#0b0b0b] p-3.5 rounded-xl border border-gray-800">
                                <label className="block text-[11px] font-semibold text-gray-400 mb-1.5">
                                  Фокусировка (мин)
                                </label>
                                <div className="flex items-center space-x-2">
                                  <input
                                    type="number"
                                    min="5"
                                    max="120"
                                    value={pomodoroFocusTime}
                                    onChange={(e) => setPomodoroFocusTime(Math.max(1, parseInt(e.target.value, 10) || 45))}
                                    className="w-full bg-[#181818] border border-gray-700 rounded-lg px-3 py-1.5 text-sm font-bold text-white focus:outline-none focus:border-accent-emerald"
                                  />
                                  <span className="text-xs text-gray-500 font-bold">мин</span>
                                </div>
                              </div>

                              <div className="bg-[#0b0b0b] p-3.5 rounded-xl border border-gray-800">
                                <label className="block text-[11px] font-semibold text-gray-400 mb-1.5">
                                  Отдых (мин)
                                </label>
                                <div className="flex items-center space-x-2">
                                  <input
                                    type="number"
                                    min="1"
                                    max="60"
                                    value={pomodoroBreakTime}
                                    onChange={(e) => setPomodoroBreakTime(Math.max(1, parseInt(e.target.value, 10) || 10))}
                                    className="w-full bg-[#181818] border border-gray-700 rounded-lg px-3 py-1.5 text-sm font-bold text-white focus:outline-none focus:border-accent-emerald"
                                  />
                                  <span className="text-xs text-gray-500 font-bold">мин</span>
                                </div>
                              </div>
                            </div>

                            <div>
                              <div className="text-[11px] text-gray-400 font-semibold mb-2">Быстрый выбор:</div>
                              <div className="grid grid-cols-3 gap-2">
                                <button
                                  onClick={() => { setPomodoroFocusTime(25); setPomodoroBreakTime(5); }}
                                  className={`py-1.5 px-2 rounded-lg text-xs font-semibold border transition ${
                                    pomodoroFocusTime === 25 && pomodoroBreakTime === 5
                                      ? 'bg-accent-emerald/20 border-accent-emerald text-accent-emerald'
                                      : 'bg-[#0b0b0b] border-gray-800 text-gray-400 hover:text-white'
                                  }`}
                                >
                                  25 / 5 мин
                                </button>
                                <button
                                  onClick={() => { setPomodoroFocusTime(45); setPomodoroBreakTime(10); }}
                                  className={`py-1.5 px-2 rounded-lg text-xs font-semibold border transition ${
                                    pomodoroFocusTime === 45 && pomodoroBreakTime === 10
                                      ? 'bg-accent-emerald/20 border-accent-emerald text-accent-emerald'
                                      : 'bg-[#0b0b0b] border-gray-800 text-gray-400 hover:text-white'
                                  }`}
                                >
                                  45 / 10 мин
                                </button>
                                <button
                                  onClick={() => { setPomodoroFocusTime(60); setPomodoroBreakTime(15); }}
                                  className={`py-1.5 px-2 rounded-lg text-xs font-semibold border transition ${
                                    pomodoroFocusTime === 60 && pomodoroBreakTime === 15
                                      ? 'bg-accent-emerald/20 border-accent-emerald text-accent-emerald'
                                      : 'bg-[#0b0b0b] border-gray-800 text-gray-400 hover:text-white'
                                  }`}
                                >
                                  60 / 15 мин
                                </button>
                              </div>
                            </div>

                            <div className="p-3 bg-[#0b0b0b] rounded-xl border border-gray-800 flex items-center justify-between text-xs">
                              <span className="text-gray-400 font-medium">Завершенных циклов фокуса:</span>
                              <span className="font-bold text-white font-mono bg-[#222222] px-2.5 py-0.5 rounded text-sm">
                                {pomodoroCount}
                              </span>
                            </div>
                          </div>
                        ) : (
                          <div className="py-4 text-center border-t border-gray-800 animate-fadeIn">
                            <p className="text-xs text-gray-500">
                              Включите переключатель Pomodoro для использования интервального метода.
                            </p>
                          </div>
                        )
                      )}

                    </div>
                  </div>

                </div>

              </div>
            ) : (
              /* ANALYTICS TAB */
              <div className="space-y-8 animate-fadeIn">
                <div className="panel-graphite rounded-2xl p-6 shadow-xl">
                  <h2 className="text-xl font-bold text-white mb-1">Аналитика</h2>
                  <p className="text-xs text-gray-400">Общая статистика запланированного и фактического времени</p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                  {/* CARD 1: Total Planned Time */}
                  <div className="panel-graphite rounded-2xl p-6 border-t-2 border-t-gray-500 flex flex-col justify-between h-36">
                    <div className="flex items-center justify-between">
                      <div className="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Запланировано</div>
                      <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
                      </svg>
                    </div>
                    <div className="text-2xl font-extrabold text-white font-mono">
                      {formatMinutesHuman(Math.round(stats.totalPlannedSec / 60))}
                    </div>
                  </div>

                  {/* CARD 2: Total Actual Spent Time */}
                  <div className="panel-graphite rounded-2xl p-6 border-t-2 border-t-accent-emerald flex flex-col justify-between h-36">
                    <div className="flex items-center justify-between">
                      <div className="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Фактическое время</div>
                      <svg className="w-5 h-5 text-accent-emerald" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" d="m3.75 13.5 10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75Z" />
                      </svg>
                    </div>
                    <div className="text-2xl font-extrabold text-accent-emerald font-mono">
                      {formatTime(stats.totalActualSec, true)}
                    </div>
                  </div>

                  {/* CARD 3: Completed Task Count */}
                  <div className="panel-graphite rounded-2xl p-6 border-t-2 border-t-accent-gold flex flex-col justify-between h-36">
                    <div className="flex items-center justify-between">
                      <div className="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Выполнено задач</div>
                      <svg className="w-5 h-5 text-accent-gold" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M11.42 15.17L17.25 21A2.5 2.5 0 0021 17.25l-5.83-5.83a7.5 7.5 0 10-3.75 3.75z" />
                      </svg>
                    </div>
                    <div className="text-2xl font-extrabold text-accent-gold font-mono">
                      {stats.completedTasksCount} / {stats.totalTasksCount} ({stats.completionPercentage}%)
                    </div>
                  </div>

                  {/* CARD 4: Pause Count Metric */}
                  <div className="panel-graphite rounded-2xl p-6 border-t-2 border-t-accent-rose flex flex-col justify-between h-36">
                    <div className="flex items-center justify-between">
                      <div className="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Всего пауз</div>
                      <svg className="w-5 h-5 text-accent-rose" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M15.75 5.25v13.5m-7.5-13.5v13.5" />
                      </svg>
                    </div>
                    <div className="text-2xl font-extrabold text-accent-rose font-mono">
                      {stats.totalPauseCount}
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                  {/* BAR CHART */}
                  <div className="panel-graphite rounded-2xl p-6 space-y-4">
                    <h3 className="text-base font-bold text-white flex items-center gap-3">
                      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <rect x="3" y="11" width="4" height="10" rx="1.5" fill="#ffffff" />
                        <rect x="10" y="4" width="4" height="17" rx="1.5" fill="#ffffff" />
                        <rect x="17" y="8" width="4" height="13" rx="1.5" fill="#ffffff" />
                      </svg>
                      <span>Запланированное / Фактическое время</span>
                    </h3>

                    <div className="space-y-5 pt-2">
                      {stats.taskBreakdown.map((item, idx) => {
                        const plannedMins = Math.round(item.plannedSec / 60);
                        const actualMins = Math.round(item.actualSec / 60);
                        const overtimeMins = Math.round(item.overtimeSec / 60);
                        const maxVal = Math.max(1, plannedMins, actualMins + overtimeMins);

                        const plannedWidth = (plannedMins / maxVal) * 100;
                        const actualWidth = (actualMins / maxVal) * 100;

                        return (
                          <div key={idx} className="bg-[#0b0b0b] p-3.5 rounded-xl border border-gray-800 space-y-2">
                            <div className="flex justify-between text-xs font-semibold">
                              <span className="text-white truncate max-w-[180px]">{item.title}</span>
                              <span className="text-gray-400 font-mono text-[11px]">
                                План: {plannedMins}м | Факт: {actualMins}м {overtimeMins > 0 ? `(+${overtimeMins}м)` : ''} | Пауз: {item.pauseCount}
                              </span>
                            </div>

                            <div className="space-y-1">
                              <div className="w-full bg-[#181818] h-2.5 rounded-full overflow-hidden">
                                <div 
                                  className="bg-gray-500 h-full rounded-full transition-all duration-500" 
                                  style={{ width: `${Math.min(100, plannedWidth)}%` }} 
                                />
                              </div>
                              <div className="w-full bg-[#181818] h-2.5 rounded-full overflow-hidden flex">
                                <div 
                                  className="bg-accent-emerald h-full rounded-l-full transition-all duration-500" 
                                  style={{ width: `${Math.min(100, actualWidth)}%` }} 
                                />
                                {overtimeMins > 0 && (
                                  <div 
                                    className="bg-accent-amber h-full rounded-r-full transition-all duration-500" 
                                    style={{ width: `${Math.min(100, (overtimeMins / maxVal) * 100)}%` }} 
                                  />
                                )}
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* DONUT CHART */}
                  <div className="panel-graphite rounded-2xl p-6 space-y-4">
                    <h3 className="text-base font-bold text-white flex items-center gap-3">
                      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="8" stroke="#ffffff" strokeWidth="2.5" strokeLinecap="round" strokeDasharray="38 12" />
                      </svg>
                      <span>Статус выполнения</span>
                    </h3>

                    <div className="flex flex-col sm:flex-row items-center justify-center gap-8 py-6">
                      <div className="relative w-44 h-44 flex items-center justify-center">
                        <svg className="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                          <path
                            className="text-gray-800"
                            strokeWidth="3.8"
                            stroke="currentColor"
                            fill="none"
                            d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                          />
                          <path
                            className="text-accent-gold transition-all duration-1000"
                            strokeDasharray={`${stats.completionPercentage}, 100`}
                            strokeWidth="3.8"
                            strokeLinecap="round"
                            stroke="currentColor"
                            fill="none"
                            d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                          />
                        </svg>
                        <div className="absolute flex flex-col items-center justify-center text-center">
                          <span className="text-3xl font-extrabold text-amber-400 font-mono">
                            {stats.completionPercentage}%
                          </span>
                          <span className="text-[10px] uppercase tracking-wider text-gray-400 font-bold">
                            Выполнено
                          </span>
                        </div>
                      </div>

                      <div className="space-y-3">
                        <div className="flex items-center space-x-3 text-xs">
                          <span className="w-3 h-3 rounded-full bg-accent-gold" />
                          <span className="text-gray-300 font-medium">Завершенные:</span>
                          <span className="font-bold text-white font-mono">{stats.completedTasksCount}</span>
                        </div>
                        <div className="flex items-center space-x-3 text-xs">
                          <span className="w-3 h-3 rounded-full bg-accent-emerald" />
                          <span className="text-gray-300 font-medium">В процессе:</span>
                          <span className="font-bold text-white font-mono">{stats.totalTasksCount - stats.completedTasksCount}</span>
                        </div>
                      </div>
                    </div>
                  </div>

                </div>
              </div>
            )}
          </main>

          {/* EDIT TASK MODAL */}
          {editingTask && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="panel-graphite max-w-md w-full rounded-2xl p-6 shadow-2xl border border-gray-700">
                <h3 className="text-lg font-bold text-white mb-4">Редактирование задачи</h3>
                <form onSubmit={handleSaveEditedTask} className="space-y-4">
                  <div>
                    <label className="block text-xs text-gray-400 font-semibold mb-1">Название задачи</label>
                    <input
                      type="text"
                      value={editingTask.title}
                      onChange={(e) => setEditingTask({ ...editingTask, title: e.target.value })}
                      className="w-full bg-[#0b0b0b] border border-gray-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-white"
                    />
                  </div>

                  <div>
                    <label className="block text-xs text-gray-400 font-semibold mb-1">Запланированное время</label>
                    <div className="flex items-center space-x-3 bg-[#0b0b0b] border border-gray-700 rounded-xl px-4 py-2">
                      <input
                        type="number"
                        min="0"
                        max="99"
                        value={editingTask.hours}
                        onChange={(e) => setEditingTask({ ...editingTask, hours: e.target.value })}
                        className="w-14 bg-transparent text-center font-bold text-white focus:outline-none"
                      />
                      <span className="text-xs text-gray-400 font-bold">часов</span>
                      <span className="text-gray-600">:</span>
                      <input
                        type="number"
                        min="0"
                        max="59"
                        value={editingTask.mins}
                        onChange={(e) => setEditingTask({ ...editingTask, mins: e.target.value })}
                        className="w-14 bg-transparent text-center font-bold text-white focus:outline-none"
                      />
                      <span className="text-xs text-gray-400 font-bold">минут</span>
                    </div>
                  </div>

                  <div className="flex space-x-3 pt-2">
                    <button
                      type="button"
                      onClick={() => setEditingTask(null)}
                      className="flex-1 py-2.5 bg-gray-800 text-gray-300 font-bold text-xs rounded-xl hover:bg-gray-700"
                    >
                      Отмена
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 bg-accent-emerald text-black font-bold text-xs rounded-xl hover:bg-accent-emeraldHover"
                    >
                      Сохранить изменения
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* POMODORO START BREAK PROMPT MODAL */}
          {showBreakPromptModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="panel-graphite max-w-md w-full rounded-2xl p-6 shadow-2xl text-center border border-blue-500/40">
                <div className="w-12 h-12 rounded-full bg-blue-500/20 text-blue-400 border border-blue-500/40 mx-auto mb-3 flex items-center justify-center text-xl font-bold">
                  ☕
                </div>
                <h3 className="text-xl font-bold text-white mb-2">Время отдохнуть!</h3>
                <p className="text-xs text-gray-300 mb-6">
                  Вы отлично отработали <strong>{pomodoroFocusTime} минут</strong>. Сделаем <strong>{pomodoroBreakTime}-минутный перерыв</strong>?
                </p>
                <div className="flex space-x-3">
                  <button
                    onClick={handleSkipBreakPrompt}
                    className="flex-1 py-3 bg-gray-800 text-gray-300 font-bold text-xs rounded-xl hover:bg-gray-700"
                  >
                    Пропустить
                  </button>
                  <button
                    onClick={handleAcceptBreakPrompt}
                    className="flex-1 py-3 bg-blue-600 hover:bg-blue-500 text-white font-extrabold text-xs rounded-xl shadow-lg shadow-blue-900/40 transition"
                  >
                    Да, отдохнуть ({pomodoroBreakTime} мин)
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* POMODORO BREAK FINISHED PROMPT MODAL */}
          {showBreakFinishedModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="panel-graphite max-w-md w-full rounded-2xl p-6 shadow-2xl text-center border border-accent-emerald/40">
                <div className="w-12 h-12 rounded-full bg-accent-emerald/20 text-accent-emerald border border-accent-emerald/40 mx-auto mb-3 flex items-center justify-center text-xl font-bold">
                  🔔
                </div>
                <h3 className="text-xl font-bold text-white mb-2">Перерыв окончен!</h3>
                <p className="text-xs text-gray-300 mb-6">
                  Отдых ({pomodoroBreakTime} мин) завершен. Готовы снова приступить к фокусировке?
                </p>
                <div className="flex space-x-3">
                  <button
                    onClick={handleDismissBreakFinished}
                    className="flex-1 py-3 bg-gray-800 text-gray-300 font-bold text-xs rounded-xl hover:bg-gray-700"
                  >
                    Позже
                  </button>
                  <button
                    onClick={handleAcceptBreakFinished}
                    className="flex-1 py-3 bg-accent-emerald hover:bg-accent-emeraldHover text-black font-extrabold text-xs rounded-xl shadow-lg shadow-emerald-900/40 transition"
                  >
                    Продолжить работу
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* TASK OVERTIME PROMPT MODAL (If Pomodoro is OFF) */}
          {showTaskOvertimeModal && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="panel-graphite max-w-md w-full rounded-2xl p-6 shadow-2xl text-center border border-accent-amber/40">
                <div className="w-12 h-12 rounded-full bg-amber-500/20 text-accent-amber border border-amber-500/40 mx-auto mb-3 flex items-center justify-center text-xl font-bold">
                  ⚠️
                </div>
                <h3 className="text-xl font-bold text-white mb-2">Время задачи вышло!</h3>
                <p className="text-xs text-gray-300 mb-6">
                  Запланированное время задачи <strong>«{activeTask?.title}»</strong> закончилось. Переходим в овертайм?
                </p>
                <div className="flex space-x-3">
                  <button
                    onClick={() => {
                      stopAlarmSound();
                      setShowTaskOvertimeModal(false);
                      if (activeTaskId) handleToggleComplete(activeTaskId);
                      setTimerRunning(false);
                    }}
                    className="flex-1 py-3 bg-gray-800 text-gray-300 font-bold text-xs rounded-xl hover:bg-gray-700"
                  >
                    Завершить задачу
                  </button>
                  <button
                    onClick={() => {
                      stopAlarmSound();
                      setShowTaskOvertimeModal(false);
                      setIsOvertime(true);
                      setTimerRunning(true);
                    }}
                    className="flex-1 py-3 bg-accent-amber hover:bg-amber-600 text-black font-extrabold text-xs rounded-xl shadow-lg shadow-amber-900/40 transition"
                  >
                    Доп. время (Овертайм)
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
