    tailwind.config = {

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>

    body {
      background-color: #0b0b0b;

<body class="font-sans antialiased min-h-screen text-gray-200 selection:bg-white selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // High-Availability Ambient Lofi Stream
    const LOFI_STREAM_URL = 'https://stream.zeno.fm/f3wvbbqmdg8uv';

    // Helper to format total seconds to HH:MM:SS or MM:SS
    function formatTime(totalSeconds, alwaysHours = false) {
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      const pad = (n) => String(n).padStart(2, '0');

      if (h > 0 || alwaysHours) {
        return `${pad(h)}:${pad(m)}:${pad(s)}`;
      }
      return `${pad(m)}:${pad(s)}`;
    }

    // Helper to convert minutes to readable string
    function formatMinutesHuman(totalMinutes) {
      const h = Math.floor(totalMinutes / 60);
      const m = totalMinutes % 60;
      if (h > 0 && m > 0) return `${h} ч ${m} мин`;
      if (h > 0) return `${h} ч`;
      return `${m} мин`;
    }

    const INITIAL_TASKS = [
      {
        id: 't-1',
        title: 'Работа над видео',
        plannedMinutes: 180,
        actualSeconds: 0,
        overtimeSeconds: 0,
        completed: false,
        expanded: false,
        pauseCount: 0,
        children: [
          {
            id: 't-1-1',
            title: 'Концепт',
            plannedMinutes: 60,
            actualSeconds: 0,
            overtimeSeconds: 0,
            completed: false,
            pauseCount: 0,
            children: []
          },
          {
            id: 't-1-2',
            title: 'Раскадровка',
            plannedMinutes: 60,
            actualSeconds: 0,
            overtimeSeconds: 0,
            completed: false,
            pauseCount: 0,
            children: []
          },
          {
            id: 't-1-3',
            title: 'Аниматик',
            plannedMinutes: 60,
            actualSeconds: 0,
            overtimeSeconds: 0,
            completed: false,
            pauseCount: 0,
            children: []
          }
        ]
      },
      {
        id: 't-2',
        title: 'Сценарий и планирование проекта',
        plannedMinutes: 45,
        actualSeconds: 0,
        overtimeSeconds: 0,
        completed: false,
        expanded: false,
        pauseCount: 0,
        children: []
      }
    ];

    // ==========================================
    // LUXURY ANALOG CLOCK COMPONENT (Lighter Glow when Music OFF)
    // ==========================================
    function AnalogTimerClock({ elapsedSeconds, totalPlannedSeconds, overtimeSeconds, isOvertime, timerRunning, isOnBreak, isMusicEnabled }) {
      const center = 200;
      const clockRadius = 145;
      const strokeWidth = 10;
      const circum = 2 * Math.PI * (clockRadius - strokeWidth / 2);

      // Rotation angles in degrees
      const secondAngle = (elapsedSeconds % 60) * 6;
      const minuteAngle = ((elapsedSeconds / 60) % 60) * 6;
      const hourAngle = ((elapsedSeconds / 3600) % 12) * 30;

      // Progress Arc ratio
      let progressRatio = 0;
      if (totalPlannedSeconds > 0) {
        progressRatio = Math.min(1, elapsedSeconds / totalPlannedSeconds);
      }
      const strokeDashoffset = circum - progressRatio * circum;

      // Planned Target Marker Angle
      const plannedMinutes = Math.round(totalPlannedSeconds / 60);
      const targetMarkerAngle = (plannedMinutes % 60) * 6;

      // Clock Ticks
      const ticks = useMemo(() => {
        const result = [];
        for (let i = 0; i < 60; i++) {
          const angle = (i * 6) * (Math.PI / 180);
          const isMajor = i % 5 === 0;
          const tickLength = isMajor ? 12 : 6;
          const rInner = clockRadius - 24;
          const rOuter = rInner + tickLength;

          const x1 = center + rInner * Math.sin(angle);
          const y1 = center - rInner * Math.cos(angle);
          const x2 = center + rOuter * Math.sin(angle);
          const y2 = center - rOuter * Math.cos(angle);

          result.push(
            <line
              key={i}
              x1={x1}
              y1={y1}
              x2={x2}
              y2={y2}
              stroke={isMajor ? '#e5e5e5' : '#444444'}
              strokeWidth={isMajor ? 2.5 : 1}
              strokeLinecap="round"
            />
          );
        }
        return result;
      }, [clockRadius, center]);

      return (
        <div className="relative flex items-center justify-center my-4">
          <svg width="410" height="410" viewBox="0 0 400 400" className="drop-shadow-2xl overflow-visible">
            <defs>
              <radialGradient id="clockFaceBg" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stopColor="#222222" />
                <stop offset="70%" stopColor="#161616" />
                <stop offset="100%" stopColor="#0d0d0d" />
              </radialGradient>

              <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#444444" />
                <stop offset="50%" stopColor="#262626" />
                <stop offset="100%" stopColor="#121212" />
              </linearGradient>

              <linearGradient id="emeraldArc" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#34d399" />
                <stop offset="100%" stopColor="#059669" />
              </linearGradient>

              <linearGradient id="amberArc" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor="#fbbf24" />
                <stop offset="100%" stopColor="#d97706" />
              </linearGradient>

              {/* Lighter and brighter gray when music OFF (#aaaaaa) so it doesn't merge with background */}
              <radialGradient id="musicRippleGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stopColor={isMusicEnabled ? '#10b981' : '#aaaaaa'} stopOpacity="0.55" />
                <stop offset="70%" stopColor={isMusicEnabled ? '#06b6d4' : '#666666'} stopOpacity="0.2" />
                <stop offset="100%" stopColor="transparent" stopOpacity="0" />
              </radialGradient>

              <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
              </filter>
            </defs>

            {/* RADIAL EXPANDING SOFT RIPPLE GLOWS OUTWARD */}
            {timerRunning && (
              <g className="ripple-waves">
                <circle
                  cx={center}
                  cy={center}
                  r="190"
                  fill="url(#musicRippleGlow)"
                  className="ripple-glow-1 text-center"
                />
                <circle
                  cx={center}
                  cy={center}
                  r="190"
                  fill="url(#musicRippleGlow)"
                  className="ripple-glow-2 text-center"
                />
              </g>
            )}

            {/* Outer Rim */}
            <circle cx={center} cy={center} r="154" fill="url(#metalRim)" stroke="#333333" strokeWidth="2" />
            <circle cx={center} cy={center} r="147" fill="url(#clockFaceBg)" stroke="#262626" strokeWidth="2" />

            {/* Track Circle */}
            <circle
              cx={center}
              cy={center}
              r={clockRadius - strokeWidth / 2}
              fill="none"
              stroke="#262626"
              strokeWidth={strokeWidth}
            />

            {/* Forward Progress Arc */}
            <circle
              cx={center}
              cy={center}
              r={clockRadius - strokeWidth / 2}
              fill="none"
              stroke={isOvertime ? "url(#amberArc)" : "url(#emeraldArc)"}
              strokeWidth={strokeWidth}
              strokeDasharray={circum}
              strokeDashoffset={strokeDashoffset}
              strokeLinecap="round"
              transform={`rotate(-90 ${center} ${center})`}
              filter="url(#glow)"
              className="transition-all duration-500"
            />

            {/* TARGET TIME MARKER ON RIM */}
            {totalPlannedSeconds > 0 && (
              <g transform={`rotate(${targetMarkerAngle} ${center} ${center})`}>
                <line
                  x1={center}
                  y1={center - clockRadius + 10}
                  x2={center}
                  y2={center - clockRadius - 6}
                  stroke="#f59e0b"
                  strokeWidth="3.5"
                  strokeLinecap="round"
                  filter="url(#glow)"
                />
                <circle
                  cx={center}
                  cy={center - clockRadius - 6}
                  r="3.5"
                  fill="#f59e0b"
                />
              </g>
            )}

            {/* Ticks */}
            {ticks}

            {/* Minute Hand */}
            <line
              x1={center}
              y1={center}
              x2={center}
              y2={center - (clockRadius - 38)}
              stroke="#e5e5e5"
              strokeWidth="4.5"
              strokeLinecap="round"
              transform={`rotate(${minuteAngle} ${center} ${center})`}
            />

            {/* Hour Hand */}
            <line
              x1={center}
              y1={center}
              x2={center}
              y2={center - (clockRadius - 60)}
              stroke="#888888"
              strokeWidth="6"
              strokeLinecap="round"
              transform={`rotate(${hourAngle} ${center} ${center})`}
            />

            {/* SHARP ACCENT EMERALD GREEN SECOND ARROW HAND */}
            <g transform={`rotate(${secondAngle} ${center} ${center})`}>
              <line
                x1={center}
                y1={center + 15}
                x2={center}
                y2={center - (clockRadius - 15)}
                stroke={isOvertime ? "#f59e0b" : "#10b981"}
                strokeWidth="2.5"
                strokeLinecap="round"
                filter="url(#glow)"
              />
              <polygon
                points={`${center - 4.5},${center - (clockRadius - 20)} ${center + 4.5},${center - (clockRadius - 20)} ${center},${center - (clockRadius - 8)}`}
                fill={isOvertime ? "#f59e0b" : "#10b981"}
                filter="url(#glow)"
              />
            </g>

            {/* Center Cap Nut */}
            <circle cx={center} cy={center} r="7" fill={isOvertime ? "#f59e0b" : "#10b981"} />
            <circle cx={center} cy={center} r="2.5" fill="#ffffff" />

            {/* Digital Readout in Center */}
            <foreignObject x={center - 85} y={center + 25} width="170" height="60">
              <div className="text-center">
                <div className={`text-2xl font-mono font-black tracking-tight ${isOvertime ? 'text-accent-amber' : 'text-white'}`}>
                  {isOvertime ? `+${formatTime(overtimeSeconds)}` : formatTime(elapsedSeconds)}
                </div>
                <div className="text-[10px] uppercase tracking-widest text-gray-400 font-bold mt-0.5">
                  {isOnBreak ? '☕ ПЕРЕРЫВ' : isOvertime ? '⚠️ ДОП. ВРЕМЯ' : timerRunning ? '▶ В РАБОТЕ' : '⏸ НА ПАУЗЕ'}
                </div>
              </div>
            </foreignObject>
          </svg>
        </div>
      );
    }

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    function App() {
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem('focusflow_graphite_tasks');
        return saved ? JSON.parse(saved) : INITIAL_TASKS;
      });

      // Overall Task List Expand/Collapse State (Hidden by default)
      const [isTaskListExpanded, setIsTaskListExpanded] = useState(true);

      const [activeTaskId, setActiveTaskId] = useState(null);
      const [timerRunning, setTimerRunning] = useState(false);
      const [isOvertime, setIsOvertime] = useState(false);
      
      const [elapsedSeconds, setElapsedSeconds] = useState(0);
      const [overtimeSeconds, setOvertimeSeconds] = useState(0);

      // Pomodoro Configurator State — Off/Hidden by default
      const [pomodoroEnabled, setPomodoroEnabled] = useState(false);
      const [pomodoroFocusTime, setPomodoroFocusTime] = useState(45);
      const [pomodoroBreakTime, setPomodoroBreakTime] = useState(10);
      const [currentPomodoroSeconds, setCurrentPomodoroSeconds] = useState(0);
      const [isOnBreak, setIsOnBreak] = useState(false);
      const [breakRemainingSeconds, setBreakRemainingSeconds] = useState(0);
      const [pomodoroCount, setPomodoroCount] = useState(0);

      // Background Music
      const [isMusicEnabled, setIsMusicEnabled] = useState(false);
      const audioRef = useRef(null);

      // Navigation & Modal states
      const [activeTab, setActiveTab] = useState('planner');
      const [showBreakModal, setShowBreakModal] = useState(false);
      const [showFinishModal, setShowFinishModal] = useState(false);
      const [editingTask, setEditingTask] = useState(null);

      // New Task Inputs
      const [newTaskTitle, setNewTaskTitle] = useState('');
      const [newTaskHours, setNewTaskHours] = useState('1');
      const [newTaskMins, setNewTaskMins] = useState('0');
      const [parentForNewSubtask, setParentForNewSubtask] = useState(null);

      useEffect(() => {
        localStorage.setItem('focusflow_graphite_tasks', JSON.stringify(tasks));
      }, [tasks]);

      useEffect(() => {
        if (!audioRef.current) return;
        if (isMusicEnabled && timerRunning && !isOnBreak) {
          audioRef.current.play().catch(err => console.log("Audio play restriction:", err));
        } else {
          audioRef.current.pause();
        }
      }, [isMusicEnabled, timerRunning, isOnBreak]);

      const handleToggleMusic = () => {
        const nextState = !isMusicEnabled;
        setIsMusicEnabled(nextState);
        if (nextState && audioRef.current) {
          audioRef.current.play().catch(e => console.log("Gesture playback triggered"));
        } else if (audioRef.current) {
          audioRef.current.pause();
        }
      };

      const findTask = (taskList, id) => {
        for (const task of taskList) {
          if (task.id === id) return task;
          if (task.children && task.children.length > 0) {
            const found = findTask(task.children, id);
            if (found) return found;
          }
        }
        return null;
      };

      const updateTaskInTree = (taskList, id, updateFn) => {
        return taskList.map(task => {
          if (task.id === id) return updateFn(task);
          if (task.children && task.children.length > 0) {
            return {
              ...task,
              children: updateTaskInTree(task.children, id, updateFn)
            };
          }
          return task;
        });
      };

      const activeTask = useMemo(() => {
        return activeTaskId ? findTask(tasks, activeTaskId) : null;
      }, [tasks, activeTaskId]);

      const handleSelectTask = (taskId) => {
        if (timerRunning) {
          if (!confirm('Таймер сейчас запущен. Переключить задачу? Текущий прогресс сохранится.')) {
            return;
          }
          setTimerRunning(false);
        }

        const task = findTask(tasks, taskId);
        if (!task) return;

        setActiveTaskId(taskId);
        setIsOnBreak(false);

        const totalPlannedSec = task.plannedMinutes * 60;
        const actualSec = task.actualSeconds || 0;

        setElapsedSeconds(actualSec);

        if (actualSec >= totalPlannedSec) {
          setIsOvertime(true);
          setOvertimeSeconds(task.overtimeSeconds || (actualSec - totalPlannedSec));
        } else {
          setIsOvertime(false);
          setOvertimeSeconds(0);
        }
        setCurrentPomodoroSeconds(0);
      };

      // Timer Tick Interval
      useEffect(() => {
        let interval = null;

        if (timerRunning && activeTaskId) {
          interval = setInterval(() => {
            if (isOnBreak) {
              setBreakRemainingSeconds(prev => {
                if (prev <= 1) {
                  setIsOnBreak(false);
                  alert('🔔 Перерыв окончен! Готовы продолжить работу?');
                  return 0;
                }
                return prev - 1;
              });
              return;
            }

            const targetPlannedSec = activeTask ? activeTask.plannedMinutes * 60 : 0;

            setElapsedSeconds(prevSec => {
              const nextSec = prevSec + 1;
              if (targetPlannedSec > 0 && nextSec >= targetPlannedSec && !isOvertime) {
                setIsOvertime(true);
                setShowFinishModal(true);
              }
              return nextSec;
            });

            if (isOvertime) {
              setOvertimeSeconds(prev => prev + 1);
            }

            setTasks(prevTasks => updateTaskInTree(prevTasks, activeTaskId, (t) => ({
              ...t,
              actualSeconds: t.actualSeconds + 1,
              overtimeSeconds: isOvertime ? (t.overtimeSeconds || 0) + 1 : t.overtimeSeconds
            })));

            if (pomodoroEnabled) {
              setCurrentPomodoroSeconds(prev => {
                const nextVal = prev + 1;
                if (nextVal >= pomodoroFocusTime * 60) {
                  setTimerRunning(false);
                  setShowBreakModal(true);
                  setPomodoroCount(c => c + 1);
                  return 0;
                }
                return nextVal;
              });
            }

          }, 1000);
        }

        return () => clearInterval(interval);
      }, [timerRunning, activeTaskId, isOvertime, activeTask, pomodoroEnabled, pomodoroFocusTime, isOnBreak]);

      // Pause button triggers count increment
      const handlePauseTimer = () => {
        setTimerRunning(false);
        if (audioRef.current) audioRef.current.pause();
        
        if (activeTaskId) {
          setTasks(prev => updateTaskInTree(prev, activeTaskId, t => ({
            ...t,
            pauseCount: (t.pauseCount || 0) + 1
          })));
        }
      };

      const handleAddTask = () => {
        const newTaskObj = {
          id: 't-' + Date.now(),
          title: 'Хорошенько поработать',
          plannedMinutes: 60,
          actualSeconds: 0,
          overtimeSeconds: 0,
          completed: false,
          expanded: false,
          pauseCount: 0,
          children: []
        };
        setTasks(prev => [...prev, newTaskObj]);
        setIsTaskListExpanded(true);
      };

      const handleAddSubtaskDirectly = (parentId) => {
        const newSubtask = {
          id: 't-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
          title: 'Хорошенько поработать',
          plannedMinutes: 60,
          actualSeconds: 0,
          overtimeSeconds: 0,
          completed: false,
          expanded: false,
          pauseCount: 0,
          children: []
        };
        setTasks(prev => updateTaskInTree(prev, parentId, p => ({
          ...p,
          expanded: true,
          children: [...(p.children || []), newSubtask]
        })));
        setIsTaskListExpanded(true);
      };

      const handleSaveEditedTask = (e) => {
        e.preventDefault();
        if (!editingTask || !editingTask.title.trim()) return;

        const totalMins = (parseInt(editingTask.hours, 10) || 0) * 60 + (parseInt(editingTask.mins, 10) || 0);
        if (totalMins <= 0) {
          alert('Время задачи должно быть больше 0 минут.');
          return;
        }

        setTasks(prev => updateTaskInTree(prev, editingTask.id, t => ({
          ...t,
          title: editingTask.title.trim(),
          plannedMinutes: totalMins
        })));

        if (activeTaskId === editingTask.id) {
          const actualSec = editingTask.actualSeconds || 0;
          const totalPlannedSec = totalMins * 60;
          if (actualSec < totalPlannedSec) {
            setIsOvertime(false);
          }
        }

        setEditingTask(null);
      };

      const handleDeleteTask = (taskId, e) => {
        if (e) e.stopPropagation();
        if (!confirm('Удалить эту задачу и все её подзадачи?')) return;

        const removeRecursive = (list) => {
          return list
            .filter(t => t.id !== taskId)
            .map(t => ({
              ...t,
              children: removeRecursive(t.children)
            }));
        };

        setTasks(prev => removeRecursive(prev));
        if (activeTaskId === taskId) {
          setActiveTaskId(null);
          setTimerRunning(false);
        }
      };

      const handleToggleComplete = (taskId, e) => {
        if (e) e.stopPropagation();
        setTasks(prev => updateTaskInTree(prev, taskId, t => ({
          ...t,
          completed: !t.completed
        })));
      };

      const stats = useMemo(() => {
        let totalPlannedSec = 0;
        let totalActualSec = 0;
        let totalOvertimeSec = 0;
        let totalTasksCount = 0;
        let completedTasksCount = 0;
        let totalPauseCount = 0;
        const taskBreakdown = [];

        const traverse = (list) => {
          for (const item of list) {
            totalTasksCount++;
            if (item.completed) completedTasksCount++;
            totalPlannedSec += (item.plannedMinutes * 60);
            totalActualSec += (item.actualSeconds || 0);
            totalOvertimeSec += (item.overtimeSeconds || 0);
            totalPauseCount += (item.pauseCount || 0);
            
            taskBreakdown.push({
              title: item.title,
              plannedSec: item.plannedMinutes * 60,
              actualSec: item.actualSeconds || 0,
              overtimeSec: item.overtimeSeconds || 0,
              completed: item.completed,
              pauseCount: item.pauseCount || 0
            });

            if (item.children && item.children.length > 0) {
              traverse(item.children);
            }
          }
        };

        traverse(tasks);

        return {
          totalPlannedSec,
          totalActualSec,
          totalOvertimeSec,
          totalTasksCount,
          completedTasksCount,
          totalPauseCount,
          taskBreakdown,
          completionPercentage: totalTasksCount ? Math.round((completedTasksCount / totalTasksCount) * 100) : 0,
          efficiency: totalPlannedSec ? Math.round((totalActualSec / totalPlannedSec) * 100) : 0
        };
      }, [tasks]);

      const renderTaskNode = (task, level = 0) => {
        const isSelected = activeTaskId === task.id;
        const totalSubtaskMinutes = task.children.reduce((acc, c) => acc + c.plannedMinutes, 0);
        const displayPlannedMinutes = task.children.length > 0 
          ? Math.max(task.plannedMinutes, totalSubtaskMinutes)
          : task.plannedMinutes;

          <div key={task.id} className="mb-2.5">
            <div
              onClick={() => handleSelectTask(task.id)}
              className={`group flex items-center justify-between p-4 rounded-xl cursor-pointer transition-all ${
                isSelected

                    title="Раскрыть подзадачи"
                    onClick={(e) => {
                      e.stopPropagation();
                      setTasks(prev => updateTaskInTree(prev, task.id, t => ({ ...t, expanded: !t.expanded })));

                    className="p-1.5 rounded-lg text-gray-400 hover:text-white hover:bg-gray-700 transition-colors"

                  </button>

                  <div className="w-7" />

                <button
                  onClick={(e) => handleToggleComplete(task.id, e)}
                  className={`w-5 h-5 rounded flex items-center justify-center border transition-colors shrink-0 ${
                    task.completed
                      ? 'bg-accent-emerald border-accent-emerald text-black font-bold'
                      : 'border-gray-600 hover:border-white'
                  }`}
                >
                  {task.completed && (
                    <svg className="w-3.5 h-3.5 stroke-current" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" />
                    </svg>
                  )}
                </button>

                  <div className="flex items-center space-x-2">
                    <span className={`font-semibold truncate text-sm ${task.completed ? 'line-through text-gray-500' : 'text-white'}`}>
                      {task.title}

                      <span className="px-2 py-0.5 text-[10px] font-bold bg-accent-emerald/20 text-accent-emerald border border-accent-emerald/40 rounded">

                      </span>

                    {task.pauseCount > 0 && (
                      <span className="px-1.5 py-0.5 text-[10px] font-bold bg-[#333333] text-slate-300 rounded border border-gray-700" title="Количество пауз">

                    <div

                    )}

                </section>

                  {/* TASK LIST COLUMN */}

                            <svg className={`w-4 h-4 transition-transform duration-200 ${isTaskListExpanded ? 'rotate-90 text-accent-emerald' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor">

                          </button>
                          <h3 className="text-lg font-bold text-white">Задачи</h3>
                        </div>

                        <span className="text-xs font-semibold px-3 py-1 bg-[#0b0b0b] rounded-full text-gray-300 border border-gray-800">

                      {/* Unified list container */}

                          <span>+ Добавить</span>
                        </button>
                      </div>
                    </div>
                  </div>


                  


                  {/* POMODORO CONFIGURATOR COLUMN */}
                  <div className="lg:col-span-5 space-y-6">
                    <div className="panel-graphite rounded-2xl p-6 shadow-xl space-y-6 border border-gray-800">
                      
                      <div className="flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                          <div className="w-8 h-8 rounded-lg bg-[#222222] border border-gray-700 flex items-center justify-center">
                            <svg className="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>

                  {/* CARD 3: Overtime Time */}
                  <div className="panel-graphite rounded-2xl p-6 border-t-2 border-t-accent-amber flex flex-col justify-between h-36">
                    <div className="flex items-center justify-between">
                      <div className="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Доп. время</div>
                      <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                      </svg>
                    </div>
                    <div className="text-2xl font-extrabold text-accent-amber font-mono">
                      +{formatTime(stats.totalOvertimeSec, true)}
                    </div>
                  </div>

                  {/* CARD 4: Completed Task Count */}
                  <div className="panel-graphite rounded-2xl p-6 border-t-2 border-t-white flex flex-col justify-between h-36">
                    <div className="flex items-center justify-between">
                      <div className="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Выполнено</div>
                      <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M11.42 15.17L17.25 21A2.5 2.5 0 0021 17.25l-5.83-5.83a7.5 7.5 0 10-3.75 3.75z" />
                      </svg>
                    </div>
                    <div className="text-2xl font-extrabold text-white font-mono">
                      {stats.completedTasksCount} / {stats.totalTasksCount} ({stats.completionPercentage}%)
                    </div>
                  </div>

                  {/* NEW CARD 5: Pause Count Metric */}
                  <div className="panel-graphite rounded-2xl p-6 border-t-2 border-t-accent-purple flex flex-col justify-between h-36">
                    <div className="flex items-center justify-between">
                      <div className="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Всего пауз</div>
                      {/* Minimal White SVG Pause icon */}
                      <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M15.75 5.25v13.5m-7.5-13.5v13.5" />
                      </svg>
                    </div>
                    <div className="text-2xl font-extrabold text-white font-mono">
                      {stats.totalPauseCount}
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                  {/* BAR CHART */}
                  <div className="panel-graphite rounded-2xl p-6 space-y-4">
                    <h3 className="text-base font-bold text-white flex items-center gap-3">
                      {/* White Minimalist Rect Bar chart icon */}
                      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <rect x="3" y="11" width="4" height="10" rx="1.5" fill="#ffffff" />
                        <rect x="10" y="4" width="4" height="17" rx="1.5" fill="#ffffff" />
                        <rect x="17" y="8" width="4" height="13" rx="1.5" fill="#ffffff" />
                      </svg>
                      <span>Запланированное / Фактическое время</span>
                    </h3>

                    <div className="space-y-5 pt-2">
                      {stats.taskBreakdown.map((item, idx) => {
                        const plannedMins = Math.round(item.plannedSec / 60);
                        const actualMins = Math.round(item.actualSec / 60);
                        const overtimeMins = Math.round(item.overtimeSec / 60);
                        const maxVal = Math.max(1, plannedMins, actualMins + overtimeMins);

                        const plannedWidth = (plannedMins / maxVal) * 100;
                        const actualWidth = (actualMins / maxVal) * 100;

                        return (
                          <div key={idx} className="bg-[#0b0b0b] p-3.5 rounded-xl border border-gray-800 space-y-2">
                            <div className="flex justify-between text-xs font-semibold">
                              <span className="text-white truncate max-w-[180px]">{item.title}</span>
                              <span className="text-gray-400 font-mono text-[11px]">
                                План: {plannedMins}м | Факт: {actualMins}м {overtimeMins > 0 ? `(+${overtimeMins}м)` : ''} | Пауз: {item.pauseCount}
                              </span>
                            </div>

                            <div className="space-y-1">
                              <div className="w-full bg-[#181818] h-2.5 rounded-full overflow-hidden">
                                <div 
                                  className="bg-gray-500 h-full rounded-full transition-all duration-500" 
                                  style={{ width: `${Math.min(100, plannedWidth)}%` }} 
                                />
                              </div>
                              <div className="w-full bg-[#181818] h-2.5 rounded-full overflow-hidden flex">
                                <div 
                                  className="bg-accent-emerald h-full rounded-l-full transition-all duration-500" 
                                  style={{ width: `${Math.min(100, actualWidth)}%` }} 
                                />
                                {overtimeMins > 0 && (
                                  <div 
                                    className="bg-accent-amber h-full rounded-r-full transition-all duration-500" 
                                    style={{ width: `${Math.min(100, (overtimeMins / maxVal) * 100)}%` }} 
                                  />
                                )}
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {/* DONUT CHART */}
                  <div className="panel-graphite rounded-2xl p-6 space-y-4">
                    <h3 className="text-base font-bold text-white flex items-center gap-3">
                      {/* White Minimalist Donut segments ring icon */}
                      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="12" r="8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="38 12" />
                      </svg>
                      <span>Статус задач</span>
                    </h3>

                    <div className="flex flex-col sm:flex-row items-center justify-center gap-8 py-6">
                      <div className="relative w-44 h-44 flex items-center justify-center">
                        <svg className="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                          <path
                            className="text-gray-800"
                            strokeWidth="3.8"
                            stroke="currentColor"
                            fill="none"
                            d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                          />
                          <path
                            className="text-accent-emerald transition-all duration-1000"
                            strokeDasharray={`${stats.completionPercentage}, 100`}
                            strokeWidth="3.8"
                            strokeLinecap="round"
                            stroke="currentColor"
                            fill="none"
                            d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                          />
                        </svg>
                        <div className="absolute flex flex-col items-center justify-center text-center">
                          <span className="text-3xl font-extrabold text-white font-mono">
                            {stats.completionPercentage}%
                          </span>
                          <span className="text-[10px] uppercase tracking-wider text-gray-400 font-bold">
                            Выполнено
                          </span>
                        </div>
                      </div>

                      <div className="space-y-3">
                        <div className="flex items-center space-x-3 text-xs">
                          <span className="w-3 h-3 rounded-full bg-accent-emerald" />
                          <span className="text-gray-300 font-medium">Завершенные:</span>
                          <span className="font-bold text-white font-mono">{stats.completedTasksCount}</span>
                        </div>
                        <div className="flex items-center space-x-3 text-xs">
                          <span className="w-3 h-3 rounded-full bg-gray-600" />
                          <span className="text-gray-300 font-medium">В процессе:</span>
                          <span className="font-bold text-white font-mono">{stats.totalTasksCount - stats.completedTasksCount}</span>
                        </div>
                        <div className="flex items-center space-x-3 text-xs">
                          <span className="w-3 h-3 rounded-full bg-accent-amber" />
                          <span className="text-gray-300 font-medium">С овертаймом:</span>
                          <span className="font-bold text-white font-mono">
                            {stats.taskBreakdown.filter(t => t.overtimeSec > 0).length}
                          </span>
                        </div>
                      </div>
                    </div>
                  </div>

                </div>
              </div>
            )}
          </main>

          {/* EDIT TASK MODAL */}
          {editingTask && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="panel-graphite max-w-md w-full rounded-2xl p-6 shadow-2xl border border-gray-700">
                <h3 className="text-lg font-bold text-white mb-4">Редактирование задачи</h3>
                <form onSubmit={handleSaveEditedTask} className="space-y-4">
                  <div>
                    <label className="block text-xs text-gray-400 font-semibold mb-1">Название задачи</label>
                    <input
                      type="text"
                      value={editingTask.title}
                      onChange={(e) => setEditingTask({ ...editingTask, title: e.target.value })}
                      className="w-full bg-[#0b0b0b] border border-gray-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-white"
                    />
                  </div>

                  <div>
                    <label className="block text-xs text-gray-400 font-semibold mb-1">Запланированное время</label>
                    <div className="flex items-center space-x-3 bg-[#0b0b0b] border border-gray-700 rounded-xl px-4 py-2">
                      <input
                        type="number"
                        min="0"
                        max="99"
                        value={editingTask.hours}
                        onChange={(e) => setEditingTask({ ...editingTask, hours: e.target.value })}
                        className="w-14 bg-transparent text-center font-bold text-white focus:outline-none"
                      />
                      <span className="text-xs text-gray-400 font-bold">часов</span>
                      <span className="text-gray-600">:</span>
                      <input
                        type="number"
                        min="0"
                        max="59"
                        value={editingTask.mins}
                        onChange={(e) => setEditingTask({ ...editingTask, mins: e.target.value })}
                        className="w-14 bg-transparent text-center font-bold text-white focus:outline-none"
                      />
                      <span className="text-xs text-gray-400 font-bold">минут</span>
                    </div>
                  </div>

                  <div className="flex space-x-3 pt-2">
                    <button
                      type="button"
                      onClick={() => setEditingTask(null)}
                      className="flex-1 py-2.5 bg-gray-800 text-gray-300 font-bold text-xs rounded-xl hover:bg-gray-700"
                    >
                      Отмена
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 bg-white text-black font-bold text-xs rounded-xl hover:bg-gray-200"
                    >
                      Сохранить изменения
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* POMODORO MODAL */}
          {showBreakModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="panel-graphite max-w-md w-full rounded-2xl p-6 shadow-2xl text-center border border-accent-emerald/40">
                <h3 className="text-xl font-bold text-white mb-2">Время Pomodoro-паузы! ☕</h3>
                <p className="text-xs text-gray-300 mb-6">
                  Вы отлично отработали {pomodoroFocusTime} минут. Сделайте {pomodoroBreakTime}-минутный перерыв.
                </p>
                <div className="flex space-x-3">
                  <button
                    onClick={() => { setShowBreakModal(false); setTimerRunning(true); }}
                    className="flex-1 py-3 bg-gray-800 text-gray-300 font-bold text-xs rounded-xl"
                  >
                    Пропустить
                  </button>
                  <button
                    onClick={() => {
                      setShowBreakModal(false);
                      setIsOnBreak(true);
                      setBreakRemainingSeconds(pomodoroBreakTime * 60);
                      setTimerRunning(true);
                    }}
                    className="flex-1 py-3 bg-accent-emerald text-black font-extrabold text-xs rounded-xl hover:bg-accent-emeraldHover"
                  >
                    Взять перерыв ({pomodoroBreakTime} мин)
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* OVERTIME MODAL */}
          {showFinishModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="panel-graphite max-w-md w-full rounded-2xl p-6 shadow-2xl text-center border border-accent-amber/40">
                <h3 className="text-xl font-bold text-white mb-2">Запланированное время закончилось!</h3>
                <p className="text-xs text-slate-300 mb-6">
                  Время задачи <strong>«{activeTask?.title}»</strong> истекло. Желаете продолжить с доп. временем?
                </p>
                <div className="flex flex-col space-y-3">
                  <button
                    onClick={() => {
                      setShowFinishModal(false);
                      setIsOvertime(true);
                      setTimerRunning(true);
                    }}
                    className="w-full py-3 bg-accent-amber text-black font-extrabold text-xs rounded-xl"
                  >
                    Продолжить (Дополнительное время)
                  </button>
                  <button
                    onClick={() => {
                      setShowFinishModal(false);
                      setTimerRunning(false);
                      if (activeTaskId) handleToggleComplete(activeTaskId);
                    }}
                    className="w-full py-3 bg-gray-800 text-white font-bold text-xs rounded-xl hover:bg-gray-700"
                  >
                    Завершить задачу
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
